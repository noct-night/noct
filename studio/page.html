<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NOCT · studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/*noct:css*/</style>
</head>
<body>

<!-- The sign-in door. Server-rendered as the whole page when there is no session, so an unauthenticated
     visitor never receives the studio markup at all. -->
<div class="wrap" id="gateView" hidden>
  <form class="gate" id="gateForm">
    <h1>NOCT studio</h1>
    <p>Sign in to review the weekend.</p>
    <input type="password" id="gatePass" name="password" placeholder="Studio password" autocomplete="current-password" required>
    <button class="btn btn-go" type="submit">Sign in</button>
    <p class="err" id="gateErr" hidden></p>
  </form>
</div>

<!--noct:studio-start-->
<div class="wrap" id="studioView" hidden>
  <header class="bar"><span>NO</span><span>CT</span></header>

  <div class="mast">
    <h1>Instagram posts</h1>
    <div class="ready" id="ready">Nothing approved yet</div>
  </div>

  <div class="tools" id="filters"></div>

  <div class="treat">
    <label for="tx">Flyer treatment</label>
    <select id="tx">
      <option value="none">None, raw</option>
      <option value="mono" selected>Mono</option>
      <option value="crush">Mono, crushed</option>
      <option value="warm">Warm mono</option>
    </select>
    <label for="gr">Grain</label>
    <select id="gr"><option value="off" selected>Off</option><option value="on">On</option></select>
    <span class="treat-note">One look across the feed: this applies to every post that has not been published
      yet. Hover a slide to change how a flyer is framed when a centre crop cuts into the artwork.</span>
  </div>

  <main id="stream"></main>
</div>
<!--noct:studio-end-->

<script>/*noct:gate*/</script>
<script>/*noct:js*/</script>
</body>
</html>
