<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Safari tints the status bar and toolbar from theme-color. Without it those bands stay light and
     the artwork appears to stop short of the island at the top and the home indicator at the bottom. -->
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NOCT · this weekend</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <div class="topscrim" id="topscrim"></div>
  <div class="botscrim" id="botscrim"></div>
  <div class="top">
    <div class="brand"><button class="bm" onclick="goHome()" aria-label="Home">NO</button><button class="bm" onclick="goProfile()" aria-label="Your profile">CT</button></div>
    <div class="ctrl" id="ctrlRow">
      <button id="btnLoc"><b id="locLbl">New York</b><i>▼</i></button>
      <div class="sep"></div>
      <button id="btnDate"><b id="dateLbl">Tonight</b><i>▼</i></button>
    </div>
    <div class="seg" id="btnFor" hidden role="group" aria-label="Which nights to show">
      <button data-sel="all" aria-pressed="true">All</button>
      <button data-sel="picks" aria-pressed="false" hidden>Picks</button>
    </div>
    <div class="ctrl" id="backRow" hidden>
      <button onclick="goBack()"><i style="font-size:14px;opacity:1">←</i><b id="backLbl">Events</b></button>
    </div>
    <div class="fbar" id="fbar" hidden></div>
    <div id="liveNote" class="sm" style="margin-top:10px;font-size:12.5px;color:var(--d2)" hidden></div>
  </div>

  <section class="view" id="imageView">
    <div id="slides"></div>
    <div class="grain"></div>
    <div class="gate" id="gate"></div>
    <button class="zone l" aria-label="Previous" onclick="step(-1)"></button>
    <button class="zone r" aria-label="Next" onclick="step(1)"></button>
    <div class="caption" id="caption"></div>
    <div class="swipe sm"><button onclick="arrow(-1)">←</button><span id="swipeLbl">Swipe</span><button onclick="arrow(1)">→</button></div>
  </section>

  <section class="view" id="mapView" hidden>
    <div id="map" aria-label="Map of tonight's venues"></div>
    <div class="mapnote" id="mapNote" hidden></div>
  </section>

  <section class="view" id="listView" hidden>
    <div id="rows"></div>
  </section>

  <section class="view" id="savedView" hidden>
    <div class="vtitle">Saved</div>
    <div class="blk"><div class="slab">Your taste</div><div id="recList"></div></div>
    <div class="blk"><div class="slab">Going</div><div id="goingList"></div></div>
    <div class="blk"><div class="slab">Saved</div><div id="savedList"></div></div>
  </section>

  <section class="view" id="venuesView" hidden>
    <div class="vtitle">Venues</div>
    <div class="blk"><div class="slab">Venues this weekend</div><div id="venueList"></div></div>
  </section>

  <section class="view" id="profileView" hidden><div id="profileBody"></div></section>

  <div class="bottom">
    <button class="lnk" id="openMenu">Menu</button>
    <div class="cr">
      <button data-mode="image" aria-pressed="true">Image</button>
      <button data-mode="list" aria-pressed="false">List</button>
      <button data-mode="map" aria-pressed="false" id="modeMap" hidden>Map</button>
    </div>
  </div>

  <div class="sheet down" id="menu">
    <button class="sx" onclick="closeAll()" aria-label="Close">✕</button>
    <div class="stack" id="mNav"></div>
  </div>

  <div class="sheet" id="locSheet">
    <button class="sx" onclick="closeAll()" aria-label="Close">✕</button>
    <div class="sh2">Where</div>
    <div class="stack"><button onclick="useGeo()">Use my location<span id="geoState">Off</span></button></div>
    <div class="grp"><h3>City</h3><div class="opts" id="oCity"></div></div>
    <div class="grp"><h3>Area</h3><div class="opts" id="oArea"></div></div>
    <div class="foot"><button class="lnk" onclick="closeAll()">Show results</button><button class="lnk" style="color:var(--d2)" onclick="resetLoc()">Reset</button></div>
  </div>

  <div class="sheet" id="dateSheet">
    <button class="sx" onclick="closeAll()" aria-label="Close">✕</button>
    <div class="sh2">When</div>
    <div class="opts" id="oPreset"></div>
    <div class="cal" id="rcal"></div>
    <div id="calList"></div>
  </div>

  <div class="sheet" id="filt">
    <button class="sx" onclick="closeAll()" aria-label="Close">✕</button>
    <div class="sh2">Filter</div>
    <div class="grp" id="gSort" hidden><h3>Sort</h3><div class="opts" id="fSort"></div></div>
    <div class="grp"><h3>Genre</h3><div class="opts" id="fGen"></div></div>
    <div class="grp"><h3>Doors</h3><div class="opts" id="fDoor"></div></div>
    <div class="grp"><h3>Availability</h3><div class="opts" id="fAvail"></div></div>
    <div class="foot"><button class="lnk" onclick="closeAll()">Show results</button><button class="lnk" style="color:var(--d2)" onclick="clearAll()">Reset</button></div>
  </div>

  <div class="sheet" id="signSheet"><div id="signBody"></div></div>

  <div class="sheet" id="onb"><div id="onbBody"></div></div>

  <div class="sheet" id="srch">
    <button class="sx" onclick="closeAll()" aria-label="Close">✕</button>
    <div class="sh2">Search</div>
    <input id="srchIn" class="sinput" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Artist, venue or night" aria-label="Search events, artists and venues">
    <div id="srchOut"></div>
  </div>

  <div class="sheet" id="artist"><div id="artistBody"></div></div>

  <div class="sheet" id="group"><div id="groupBody"></div></div>

  <div class="page" id="det"></div>
  <div class="page" id="ven"></div>
</div>
<script src="app.js"></script>
</body>
</html>
