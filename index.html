<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOCT · this weekend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0B0B;--chalk:#FFFFFF;--d1:rgba(255,255,255,.66);--d2:rgba(255,255,255,.40);
--hair:rgba(255,255,255,.22);--f:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;--pad:20px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;height:100%}
body{font-family:var(--f);color:var(--chalk);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:1px solid var(--chalk);outline-offset:3px}
.app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;overflow:hidden;background:var(--ink)}
@media (min-width:520px){.app{border-left:.7px solid rgba(255,255,255,.12);border-right:.7px solid rgba(255,255,255,.12)}}
.sm{font-size:14px;line-height:1.55}
.lnk{font-size:14px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:.7px}
.lnk:hover{opacity:.62}

.topscrim{position:absolute;top:0;left:0;right:0;height:172px;z-index:21;pointer-events:none;opacity:0;transition:opacity .28s ease;
 backdrop-filter:blur(18px) saturate(.85);-webkit-backdrop-filter:blur(18px) saturate(.85);
 background:linear-gradient(180deg,rgba(11,11,11,.86) 0%,rgba(11,11,11,.7) 56%,rgba(11,11,11,0) 100%);
 -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 60%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 60%,transparent 100%)}
.topscrim.on{opacity:1}
.botscrim{position:absolute;bottom:0;left:0;right:0;height:136px;z-index:19;pointer-events:none;opacity:0;transition:opacity .28s ease;
 backdrop-filter:blur(18px) saturate(.85);-webkit-backdrop-filter:blur(18px) saturate(.85);
 background:linear-gradient(0deg,rgba(11,11,11,.88) 0%,rgba(11,11,11,.72) 54%,rgba(11,11,11,0) 100%);
 -webkit-mask-image:linear-gradient(0deg,#000 0%,#000 58%,transparent 100%);mask-image:linear-gradient(0deg,#000 0%,#000 58%,transparent 100%)}
.botscrim.on{opacity:1}
.top{position:absolute;top:0;left:0;right:0;z-index:22;padding:18px var(--pad) 0;pointer-events:none}
.brand{display:flex;justify-content:space-between;width:100%;pointer-events:none}
.brand span{font-size:46px;font-weight:700;letter-spacing:-.018em;line-height:.86;pointer-events:auto;cursor:pointer;transition:opacity .16s}
.brand span:hover{opacity:.62}
.brand span:active{opacity:.4}
.ctrl{display:flex;align-items:center;gap:14px;margin-top:16px;pointer-events:auto}
.ctrl button{font-size:16px;display:flex;align-items:center;gap:7px;white-space:nowrap;min-width:0}
.ctrl button i{font-style:normal;font-size:10px;opacity:.55;transform:translateY(1px)}
.ctrl .sep{width:.7px;height:15px;background:var(--hair);flex:none}
.ctrl b{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.ctrl[hidden]{display:none}
#backRow button{gap:11px}
.vtitle{font-size:29px;font-weight:700;letter-spacing:-.03em;padding:0 var(--pad);margin-bottom:26px}
.view{position:absolute;inset:0}
.view[hidden]{display:none}

#imageView{overflow:hidden;touch-action:pan-y}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}
.slide.on{opacity:1}
.tex{position:absolute;inset:0}
.tex::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,11,.82) 0%,rgba(11,11,11,0) 28%,rgba(11,11,11,.24) 50%,rgba(11,11,11,.95) 100%)}
.x1{background:repeating-linear-gradient(90deg,#070707 0 5px,#242424 5px 9px,#949494 9px 10px,#3B3B3B 10px 14px),linear-gradient(180deg,#000,#141414)}
.x2{background-image:radial-gradient(circle,#7E7E7E 1px,transparent 1.3px);background-size:9px 9px;background-color:#0E0E0E}
.x3{background:radial-gradient(115% 62% at 75% 17%,rgba(255,255,255,.36) 0%,rgba(255,255,255,0) 58%),repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 6px),#0C0C0C}
.x4{background:repeating-linear-gradient(72deg,#0A0A0A 0 11px,#1F1F1F 11px 22px),repeating-linear-gradient(108deg,rgba(255,255,255,.075) 0 11px,transparent 11px 22px),#0B0B0B}
.x5{background:radial-gradient(60% 40% at 31% 61%,rgba(255,255,255,.44) 0%,rgba(255,255,255,.07) 42%,rgba(255,255,255,0) 71%),linear-gradient(200deg,#1A1A1A,#050505)}
.x6{background:repeating-linear-gradient(90deg,transparent 0 2px,rgba(255,255,255,.17) 2px 3px,transparent 3px 16px),linear-gradient(160deg,#1D1D1D,#060606)}

.caption{position:absolute;left:var(--pad);right:var(--pad);bottom:126px;z-index:15}
.caption .idx{color:var(--d1);margin-bottom:12px}
.caption .name{font-size:29px;font-weight:500;letter-spacing:-.032em;line-height:1.08;margin-bottom:11px;
 display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.caption .gen{font-size:15px;margin-bottom:9px}
.caption .meta{color:var(--d1);margin-bottom:9px}
.caption .go{color:var(--chalk);margin-bottom:16px}
.swipe{position:absolute;left:50%;transform:translateX(-50%);bottom:74px;z-index:15;display:flex;align-items:center;gap:16px;border:.7px solid var(--hair);padding:8px 16px;color:var(--d1)}
.swipe button{color:var(--chalk);font-size:14px;line-height:1}
.zone{position:absolute;top:120px;bottom:200px;width:34%;z-index:12}
.zone.l{left:0}.zone.r{right:0}

#listView{overflow-y:auto;padding:158px 0 124px;-webkit-overflow-scrolling:touch}
.srcline{padding:0 var(--pad) 20px;font-size:13px;color:var(--d2);line-height:1.5}
.dayhead{padding:22px var(--pad) 6px;font-size:13px;color:var(--d2)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:3px 14px;width:100%;padding:14px var(--pad)}
.row:active{background:#141414}
.rt{font-size:13.5px;color:var(--d2);grid-column:1;grid-row:1}
.rn{font-size:19px;font-weight:500;letter-spacing:-.026em;line-height:1.18;grid-column:1;grid-row:2;margin:3px 0 4px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rg{font-size:13.5px;grid-column:1;grid-row:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{font-size:13.5px;color:var(--d1);grid-column:1;grid-row:4;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp{font-size:15px;text-align:right;white-space:nowrap;grid-column:2;grid-row:1/3;align-self:start}
.rp.gone{color:var(--d2);font-size:13.5px}
.rs{font-size:12px;color:var(--d2);text-align:right;grid-column:2;grid-row:3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rgo{font-size:12px;color:var(--d1);text-align:right;white-space:nowrap;grid-column:2;grid-row:4;margin-top:1px}

#savedView,#venuesView,#profileView{overflow-y:auto;padding:158px 0 124px}
.slab{font-size:13px;color:var(--d2);padding:0 var(--pad);margin-bottom:14px}
.blk{margin-bottom:44px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:baseline;width:100%;padding:14px var(--pad)}
.frow:active{background:#141414}
.fn{font-size:19px;font-weight:500;letter-spacing:-.026em;line-height:1.2}
.fm{font-size:13.5px;color:var(--d1);margin-top:5px}
.tg{font-size:14px;color:var(--d2);white-space:nowrap}
.tg[aria-pressed="true"]{color:var(--chalk)}

.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 var(--pad) 22px;z-index:20;pointer-events:none}
.bottom>*{pointer-events:auto}
.cr{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.cr button{font-size:14px;color:var(--d2);display:flex;align-items:center;gap:10px}
.cr button[aria-pressed="true"]{color:var(--chalk)}
.rd{width:7px;height:7px;border-radius:50%;border:.8px solid var(--d2)}
.cr button[aria-pressed="true"] .rd{background:var(--chalk);border-color:var(--chalk)}

.sheet{position:absolute;inset:0;background:var(--ink);z-index:50;transform:translateY(101%);transition:transform .4s cubic-bezier(.5,0,.15,1);overflow-y:auto;padding:0 var(--pad) 40px}
.sheet.open{transform:translateY(0)}
.sheet.down{transform:translateY(-101%)}
.sheet.down.open{transform:translateY(0)}
#signSheet{z-index:58}
.sx{margin:22px 0 24px;font-size:22px;line-height:1;width:28px}
.sh2{font-size:29px;font-weight:700;letter-spacing:-.03em;margin-bottom:14px}
.lede{font-size:15.5px;line-height:1.6;color:var(--d1);margin-bottom:24px}
.grp{margin-top:30px}
.grp h3{font-size:13px;color:var(--d2);font-weight:400;margin-bottom:13px}
.opts{display:flex;flex-wrap:wrap;gap:11px 22px}
.opts button{font-size:16px;color:var(--d2)}
.opts button[aria-pressed="true"]{color:var(--chalk);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:.7px}
.opts button[disabled]{color:rgba(255,255,255,.18);cursor:default;text-decoration:none}
.stack button{display:flex;justify-content:space-between;align-items:baseline;width:100%;font-size:18px;padding:14px 0;border-bottom:.7px solid var(--hair)}
.stack button span{font-size:13.5px;color:var(--d2)}
.pick{width:100%;padding:16px 0;border-bottom:.7px solid var(--hair);display:block}
.pick .t{font-size:19px}
.pick .d{font-size:13.5px;color:var(--d2);margin-top:6px;line-height:1.5}
.pick[aria-pressed="true"] .t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:.7px}
.pick[aria-pressed="true"] .d{color:var(--d1)}
.foot{display:flex;gap:26px;margin-top:34px}
.cal{margin-top:30px}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.calhd .m{font-size:16px}
.calhd button{font-size:17px;color:var(--d2);padding:4px 12px;line-height:1}
.calhd button:hover{color:var(--chalk)}
.calhd button[disabled]{color:rgba(255,255,255,.18);cursor:default}
.calg{display:grid;grid-template-columns:repeat(7,1fr)}
.calg .wd{font-size:11px;color:var(--d2);text-align:center;padding-bottom:10px}
.calg button{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;color:var(--d1);text-align:center}
.calg button .n{font-size:10.5px;color:var(--d2);line-height:1}
.calg button[disabled]{color:rgba(255,255,255,.18);cursor:default}
.calg button[aria-current="date"]{color:var(--chalk)}
.calg button[aria-pressed="true"]{color:var(--chalk);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:.7px}
.calg .pad{height:48px}
.why{font-size:12.5px;color:var(--d2);line-height:1.5;margin-top:4px}
.rec{align-items:center}
.rec .recmain{width:100%;min-width:0}
.recend{display:flex;align-items:center;gap:12px}
.recx{color:var(--d2);font-size:13px;line-height:1;padding:11px 9px;margin:-11px -7px -11px 0;border-radius:999px}
.recx:active{background:#141414;color:var(--t)}
.recgone{color:var(--d2);font-size:13.5px}
/* "For you" rail: one component pinned to the top of image, list and calendar. Monochrome like the rest of
   the app, so "highlighted" means contrast and a hairline, not a colour this design does not have. */
.fy{padding-bottom:6px}
.fy[hidden]{display:none}
.fyhd{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--pad);margin-bottom:12px}
.fylab{font-size:13px;color:var(--chalk);letter-spacing:.02em}
.fylab::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--chalk);margin-right:8px;vertical-align:middle}
.fymore{font-size:13px;color:var(--d2);white-space:nowrap}
.fyrail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;
  padding:2px var(--pad) 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fyrail::-webkit-scrollbar{display:none}
.fyc{flex:0 0 auto;width:188px;scroll-snap-align:start;border:.7px solid var(--hair);
  border-radius:3px;padding:12px 13px;background:rgba(255,255,255,.04)}
.fyc:active{background:rgba(255,255,255,.10)}
.fyn{font-size:15px;line-height:1.24;font-weight:600;letter-spacing:-.012em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fym{font-size:12px;color:var(--d1);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fyw{font-size:11.5px;color:var(--d2);margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* over artwork the rail needs its own ground so the cards stay legible on any image */
#fyImage{position:absolute;left:0;right:0;z-index:23;padding-top:12px;
  background:linear-gradient(180deg,rgba(11,11,11,.84) 0%,rgba(11,11,11,.64) 62%,rgba(11,11,11,0) 100%)}
#fyImage .fyc{background:rgba(11,11,11,.55);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
#fyList{padding-top:4px;margin-bottom:26px}
#fyCal{margin:22px 0 6px}
/* the night's cards inside the When sheet: the sheet already pads the sides, so the rows only need a rule */
#calList .row{padding-left:0;padding-right:0;border-top:.7px solid var(--hair)}
.field{display:flex;align-items:baseline;gap:8px;border-bottom:.7px solid var(--hair);padding:12px 0}
.field b{font-weight:400;font-size:20px;color:var(--d2)}
.field input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;font-size:20px;outline:none;padding:0}
.field input::placeholder{color:rgba(255,255,255,.24)}
.note{font-size:13px;color:var(--d2);line-height:1.55;margin-top:12px}

.page{position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .4s cubic-bezier(.5,0,.15,1);overflow-y:auto}
.page.open{transform:translateY(0)}
#det{z-index:54}
#ven{z-index:56}
.dhero{position:relative;height:34%;min-height:220px}
.dx{position:absolute;top:20px;right:var(--pad);z-index:5;font-size:22px;line-height:1}
.dbody{padding:26px var(--pad) 50px}
.dname{font-size:27px;font-weight:500;letter-spacing:-.032em;line-height:1.1}
.dsup{font-size:15px;color:var(--d1);margin-top:10px;line-height:1.5}
.specs{display:grid;grid-template-columns:104px minmax(0,1fr);gap:9px 18px;margin-top:28px;font-size:15px;line-height:1.5}
.specs .k{color:var(--d2)}
.specs .go{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:.7px}
.tk{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:baseline;padding:12px 0}
.tk .src{font-size:17px}
.tk .st{font-size:13px;color:var(--d2);margin-top:4px;line-height:1.45}
.tk .amt{font-size:16px;text-align:right}
.tk.dead{color:var(--d2)}
.gapnote{font-size:14px;color:var(--d1);margin-top:12px;line-height:1.55}
.ro{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px 16px;padding:6px 0;align-items:baseline}
.ro .t{font-size:13.5px;color:var(--d2)}
.ro .who{font-size:16px;line-height:1.35}
.prose{font-size:15.5px;line-height:1.6;color:var(--d1)}
.dacts{display:flex;gap:24px;margin-top:34px;flex-wrap:wrap}
.dacts button[aria-pressed="true"]{color:#fff}
.empty{padding:40px var(--pad);font-size:15.5px;color:var(--d1);line-height:1.6}
.crowd{display:flex;flex-wrap:wrap;gap:9px 15px;font-size:15px;color:var(--d1)}
.crowd .me{color:var(--chalk);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:.7px}
.crowd .more{color:var(--d2)}
.goline{font-size:14px;color:var(--d1);margin-top:14px;line-height:1.55}
.links a,.links button{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:.7px solid var(--hair);font-size:17px;text-decoration:none;width:100%}
.links a span,.links button span{font-size:13.5px;color:var(--d2);text-align:right;padding-left:14px}
.strip{display:flex;gap:3px;overflow-x:auto;margin:0 calc(-1 * var(--pad));padding:0 var(--pad);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ph{flex:none;width:158px;aspect-ratio:3/4;position:relative;overflow:hidden}
.ph .cp{position:absolute;left:10px;right:10px;bottom:9px;font-size:11.5px;color:rgba(255,255,255,.9);z-index:3;line-height:1.35}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,11,0) 45%,rgba(11,11,11,.85) 100%)}
.iggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.igt{position:relative;aspect-ratio:1;overflow:hidden;display:block;width:100%}
.igt .kind{position:absolute;top:7px;right:8px;font-size:11px;z-index:3;color:#fff}
.igt .cp{position:absolute;left:8px;right:8px;bottom:7px;font-size:11px;color:rgba(255,255,255,.88);z-index:3;line-height:1.3}
.mini{font-size:13px;color:var(--d2);margin-top:12px;line-height:1.5}
.flag{font-size:12.5px;color:var(--d2);line-height:1.5;padding:0 var(--pad);margin-top:-6px;margin-bottom:18px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topscrim" id="topscrim"></div>
  <div class="botscrim" id="botscrim"></div>
  <div class="top">
    <button class="brand" onclick="goHome()" aria-label="Back to events"><span>NO</span><span>CT</span></button>
    <div class="ctrl" id="ctrlRow">
      <button id="btnLoc"><b id="locLbl">New York</b><i>▼</i></button>
      <div class="sep"></div>
      <button id="btnDate"><b id="dateLbl">Tonight</b><i>▼</i></button>
    </div>
    <div class="ctrl" id="backRow" hidden>
      <button onclick="goBack()"><i style="font-size:14px;opacity:1">←</i><b id="backLbl">Events</b></button>
    </div>
    <div id="liveNote" class="sm" style="margin-top:10px;font-size:12.5px;color:var(--d2)" hidden></div>
  </div>

  <section class="view" id="imageView">
    <div id="slides"></div>
    <div class="fy" id="fyImage" hidden></div>
    <button class="zone l" aria-label="Previous" onclick="step(-1)"></button>
    <button class="zone r" aria-label="Next" onclick="step(1)"></button>
    <div class="caption" id="caption"></div>
    <div class="swipe sm"><button onclick="step(-1)">←</button><span id="swipeLbl">Swipe</span><button onclick="step(1)">→</button></div>
  </section>

  <section class="view" id="listView" hidden>
    <div class="fy" id="fyList" hidden></div>
    <div class="srcline" id="srcLine"></div>
    <div id="rows"></div>
  </section>

  <section class="view" id="savedView" hidden>
    <div class="vtitle">Saved</div>
    <div class="blk"><div class="slab">For you</div><div id="recList"></div></div>
    <div class="blk"><div class="slab">Going</div><div id="goingList"></div></div>
    <div class="blk"><div class="slab">Saved</div><div id="savedList"></div></div>
    <div class="blk"><div class="slab">Where we pull from</div><div id="srcList"></div></div>
  </section>

  <section class="view" id="venuesView" hidden>
    <div class="vtitle">Venues</div>
    <div class="blk"><div class="slab">Venues this weekend</div><div id="venueList"></div></div>
  </section>

  <section class="view" id="profileView" hidden><div id="profileBody"></div></section>

  <div class="bottom">
    <button class="lnk" id="openMenu">Menu</button>
    <div class="cr">
      <button data-mode="image" aria-pressed="true">Image view <i class="rd"></i></button>
      <button data-mode="list" aria-pressed="false">List view <i class="rd"></i></button>
    </div>
  </div>

  <div class="sheet down" id="menu">
    <button class="sx" onclick="closeAll()" aria-label="Close">✕</button>
    <div class="stack" id="mNav"></div>
  </div>

  <div class="sheet" id="locSheet">
    <button class="sx" onclick="closeAll()" aria-label="Close">✕</button>
    <div class="sh2">Where</div>
    <div class="stack"><button onclick="useGeo()">Use my location<span id="geoState">Off</span></button></div>
    <div class="grp"><h3>City</h3><div class="opts" id="oCity"></div></div>
    <div class="grp"><h3>Area</h3><div class="opts" id="oArea"></div></div>
    <div class="foot"><button class="lnk" onclick="closeAll()">Show results</button><button class="lnk" style="color:var(--d2)" onclick="resetLoc()">Reset</button></div>
  </div>

  <div class="sheet" id="dateSheet">
    <button class="sx" onclick="closeAll()" aria-label="Close">✕</button>
    <div class="sh2">When</div>

/* true once a real feed replaces the sample weekend: only then are there rows to read and write */
let LIVE=false;
const $=s=>document.querySelector(s);

const PLATNAMES=['Eventbrite','Dice','RA','Nowadays','Tixr','Ticketmaster','Elsewhere','Good Room','Public Records','EDMTrain'];
const platformOf=l=>l.indexOf('Student')===0?'Eventbrite':(PLATNAMES.find(x=>l.indexOf(x)===0)||l.split(' ')[0]);
const platsOf=e=>[...new Set(e.srcs.map(s=>platformOf(s[0])))].join(', ');

const srcNames=()=>SOURCES.filter(s=>s[2]).map(s=>s[0]);
const joinNames=a=>a.length<2?a.join(''):`${a.slice(0,-1).join(', ')} and ${a[a.length-1]}`;

/* going, with reciprocity.
   S.going / S.saved hold event UUIDs, not the numeric render ids: the feed renumbers on every load, so only
   the uuid is stable enough to persist. These helpers keep the call sites talking in numeric ids. */
const evById=id=>EV.find(e=>e.id===id);
const uuidOf=id=>{const e=evById(id);return e?e.uuid:''};
const isGoing=id=>{const u=uuidOf(id);return !!u&&S.going.has(u)};
const isSaved=id=>{const u=uuidOf(id);return !!u&&S.saved.has(u)};
/* Handles are simulated only on the sample weekend; live events have no profiles behind them yet. */
const crowdOf=id=>{if(LIVE)return [];const n=3+(id*11)%16,o=[];for(let k=0;k<n;k++)o.push(HANDLES[(id*7+k*3)%HANDLES.length]);return[...new Set(o)]};
const attVis=h=>{const n=h.length*3+h.charCodeAt(0);return n%10<4?'public':n%10<7?'mutuals':'count'};
const iFollow=h=>(h.charCodeAt(1)+h.length)%3===0;

  const c=crowdOf(id);

  if(S.vis==='mutuals')return c.filter(h=>iFollow(h)&&attVis(h)!=='count');
  return c.filter(h=>attVis(h)==='public'||(attVis(h)==='mutuals'&&iFollow(h)));
}
/* The feed is edge-cached for five minutes, so its going_count can predate my own row. Compare the row's
   created_at with the feed's generated_at instead of guessing: newer than the feed means it is not counted
   yet (+1); a row I removed that the feed HAD counted is the -1 case (S.goOff). */
function goDelta(u){
  const at=S.mineAt.get(u);
  if(at&&at>S.feedAt)return 1;
  if(S.goOff.has(u))return -1;
  return 0;
}
const goCount=id=>{
  const e=evById(id);if(!e)return 0;
  if(!LIVE)return crowdOf(id).length+(S.going.has(e.uuid)?1:0);
  return Math.max(0,(e.going_count||0)+goDelta(e.uuid));
};

function ok(e){
  if(e.d<S.from||e.d>S.to)return false;
  const vi=vInfo(e.venue);
  if(S.area!=='All'&&vi.boro!==S.area)return false;
  if(S.gen.size&&!e.genre.some(g=>S.gen.has(g)))return false;
  if(S.door.size&&!S.door.has(band(e)))return false;
  if(S.avail.size&&!S.avail.has(e.soldout?'out':'on'))return false;
  if(S.plat.size&&!e.srcs.some(x=>S.plat.has(platformOf(x[0]))))return false;
  return true;
}
const results=()=>EV.filter(ok).sort((a,b)=>a.d-b.d||(a.door||'99').localeCompare(b.door||'99'));
const nF=()=>S.gen.size+S.door.size+S.avail.size+S.plat.size;
/* the preset's own words when one is active ("This weekend"), otherwise the nights themselves */

  if(S.rangeLabel)return S.rangeLabel;
  if(S.from===S.to){const d=DAYS[S.from]||DAYS[0];return d[2]==='Tonight'||d[2]==='Tomorrow'?d[2]:`${d[0]} ${d[1]}`}

};
const cityName=()=>(CITIES.find(c=>c[0]===S.city)||CITIES[0])[1];
const locLabel=()=>S.area==='All'?cityName():`${cityName()}, ${S.area}`;

function renderImage(){
  const list=results();

  const e=list[S.i];
  $('#caption').innerHTML=`
    <div class="idx sm">${S.i+1} of ${list.length} · ${dayFull(e.d)}</div>

    <div class="meta sm">${e.venue}${vInfo(e.venue).hood?', '+vInfo(e.venue).hood:''}${e.door?' · '+e.door:''}</div>
    <div class="go sm">${goCount(e.id)} going${isGoing(e.id)?' · you':''}</div>
    <button class="lnk" onclick="openDet(${e.id})">View event</button>`;
}
function step(n){const l=results();if(!l.length)return;S.i=(S.i+n+l.length)%l.length;renderImage()}

function renderList(){
  const list=results();
  $('#srcLine').innerHTML=list.length?`${list.length} events, ${dateLabel().toLowerCase()}. Pulled from ${joinNames(srcNames())}. Times and prices fill in as each listing is opened.`:'';
  let out='',cur=-1;
  list.forEach(e=>{
    if(e.d!==cur){cur=e.d;out+=`<div class="dayhead">${dayName(e.d)} · ${dayFull(e.d)}</div>`}
    out+=`<div class="row" role="button" tabindex="0" onclick="openDet(${e.id})" onkeydown="if(event.key==='Enter'){openDet(${e.id})}">
      <div class="rt">${e.door||'Time on listing'}</div>
      <div class="rn">${e.head}</div>
      <div class="rg">${tagLine(e)}</div>
      <div class="rv">${e.venue}</div>
      <div class="rp ${e.soldout||low(e)===null?'gone':''}">${priceLbl(e)}</div>
      <div class="rs">${platsOf(e)}</div>
      <div class="rgo">${goCount(e.id)} going</div>
    </div>`;
  });
  $('#rows').innerHTML=list.length?out:`<div class="empty">Nothing matches. <button class="lnk" onclick="clearAll()">Clear filters</button></div>`;

/* "For you": events scored against this account's own going/saved history (0015). Recommendations are not
   part of the loaded feed — they span other nights — so each carries its own date and opens on its platform. */
function renderRecs(){
  renderForYou();
  const el=$('#recList');if(!el)return;
  if(!LIVE){el.innerHTML=`<div class="empty">Live data only.</div>`;return}
  const r=S.recs;
  if(r.loading&&!r.list.length){el.innerHTML=`<div class="empty">Reading your nights…</div>`;return}
  if(r.error){el.innerHTML=`<div class="empty">Recommendations unavailable right now.</div>`;return}
  if(!r.list.length){
    el.innerHTML=r.history
      ? `<div class="empty">Nothing close enough to your ${r.history} mark${r.history===1?'':'s'} yet — check back as more nights are listed.</div>`
      : `<div class="empty">Mark a few nights you're going to and NOCT will start suggesting others.</div>`;
    return;
  }
  el.innerHTML=r.list.map((e,i)=>e.gone
    ? `<div class="frow rec"><div class="recgone">Not for me — <button class="lnk" onclick="undoRec(${i})">Undo</button></div></div>`
    : `<div class="frow rec">`
      +`<button class="recmain" onclick="openRec(${i})"><div class="fn">${e.head}</div>`
      +`<div class="fm">${e.night_label}${e.venue?' · '+e.venue:''}${e.door?' · '+e.door:''}</div>`
      +`<div class="why">${e.why}</div></button>`
      +`<div class="recend"><span class="tg">${e.price}</span>`
      +`<button class="recx" onclick="dismissRec(${i})" aria-label="Not for me, stop suggesting this">✕</button></div></div>`).join('');
}
/* The same recommendations, pinned to the top of image / list / calendar. The rail is a shortcut, not a
   second feature: it reads S.recs, indexes into the same array, and stays hidden until there is something
   worth pinning — an empty "For you" over the artwork would be pure noise. */
const FY_MOUNTS=['fyImage','fyList','fyCal'];
const FY_MAX=8;
function renderForYou(){
  const r=S.recs;
  const live=LIVE&&!r.error&&r.list.some(e=>!e.gone);
  const cards=live?r.list.map((e,i)=>[e,i]).filter(([e])=>!e.gone).slice(0,FY_MAX):[];
  const html=cards.length?`<div class="fyhd"><span class="fylab">For you</span>`
      +`<button class="fymore" onclick="setView('saved')">All ${r.list.filter(e=>!e.gone).length} →</button></div>`
    +`<div class="fyrail">`+cards.map(([e,i])=>`<button class="fyc" onclick="openRec(${i})">`
      +`<div class="fyn">${e.head}</div>`
      +`<div class="fym">${e.night_label}${e.venue?' · '+e.venue:''}</div>`
      +`<div class="fyw">${e.why}</div></button>`).join('')+`</div>`:'';
  FY_MOUNTS.forEach(id=>{const el=$('#'+id);if(!el)return;el.innerHTML=html;el.hidden=!cards.length});
  if(cards.length)placeImageRail();
}
/* The image view is full-bleed, so the rail floats under the top controls rather than pushing them down. */
function placeImageRail(){
  const el=$('#fyImage'),top=$('#ctrlRow');if(!el||!top)return;
  const b=top.getBoundingClientRect(),a=$('#app').getBoundingClientRect();
  el.style.top=Math.max(72,b.bottom-a.top+16)+'px';
}
/* A recommendation is usually on another night than the one loaded, so send people to the listing itself
   rather than silently reloading the feed underneath them. Opening one is recorded as a mild interest
   signal (0016) — after window.open, so a blocked-popup heuristic can never eat the click. */
function openRec(i){
  const e=S.recs.list[i];if(!e)return;
  const url=e.url||e.ra||e.dice;
  if(url)window.open(url,'_blank','noopener');
  feedback(e.uuid,'opened');
}
/* "Not for me": the event goes away and, from the next load on, its artists/genre/venue count against
   similar suggestions. Reversible, because ✕ sits one thumb-width from the row itself. */
function dismissRec(i){
  const e=S.recs.list[i];if(!e||e.gone)return;
  e.gone=true;renderRecs();
  feedback(e.uuid,'dismissed');
}
function undoRec(i){
  const e=S.recs.list[i];if(!e)return;
  e.gone=false;renderRecs();
  if(LIVE&&e.uuid)sbRest('DELETE','/rec_feedback?event_id=eq.'+encodeURIComponent(e.uuid)).catch(()=>{});
}
/** Record a reaction to a recommendation. Fire and forget: it tunes the next load, never this one. */
function feedback(uuid,action){
  if(!LIVE||!uuid)return;
  try{sbRest('POST','/rec_feedback',{event_id:uuid,action:action}).catch(()=>{})}catch(e){}
}
const WHY_LEAD={artist:'You saw',genre:'You go to',venue:'You go to',vibe:'Your nights are'};
function whyLine(why){
  const parts=(why||[]).slice(0,2).map(w=>`${WHY_LEAD[w.kind]||'Matches'} ${clean(w.detail)}`);
  return parts.join(' · ')||'Close to your taste';
}
async function loadRecs(){
  if(!LIVE)return;
  S.recs={loading:true,loaded:false,error:false,list:S.recs.list,history:S.recs.history};renderRecs();
  try{
    const s=await sbSession();if(!s)throw new Error('no session');
    const r=await fetch(`${API_BASE}/api/recommend?limit=12`,{headers:{accept:'application/json',authorization:'Bearer '+s.access_token}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    S.recs={loading:false,loaded:true,error:false,history:j.history_size||0,
      list:(j.events||[]).map(e=>({uuid:e.id,head:clean(e.head),venue:clean(e.venue),door:clean(e.door),
        night_label:nightLabel(e.night),price:clean(priceOf(e)),why:whyLine(e.why),
        url:cleanUrl(e.url),ra:cleanUrl(e.ra),dice:cleanUrl(e.dice)}))};
  }catch(err){S.recs={loading:false,loaded:true,error:true,list:[],history:S.recs.history}}
  renderRecs();
}
/* the recommendation JSON is the feed's event shape, so reuse its price wording */
const priceOf=e=>{const p=(e.srcs||[]).map(s=>s[1]).filter(v=>typeof v==='number');
  return e.soldout?'Sold out':(!p.length?'See listing':(Math.max(...p)!==Math.min(...p)?'From $':'$')+Math.min(...p))};
const nightLabel=d=>{if(!d)return '';const t=new Date(d+'T12:00:00Z');
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][t.getUTCDay()]+' '+
    ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][t.getUTCMonth()]+' '+t.getUTCDate()};

function toggleGoing(id){const u=uuidOf(id);if(!u)return;
  const on=!S.going.has(u),was=S.mineAt.get(u);
  if(on){S.going.add(u);S.mineAt.set(u,new Date().toISOString());S.goOff.delete(u)}
  else{S.going.delete(u);S.mineAt.delete(u);if(!(was&&was>S.feedAt))S.goOff.add(u)}
  openDet(id);render();
  invalidateRecs();                                                   /* the taste profile just changed */
  persist('going',u,on).then(ok=>{if(ok)return;                       /* server said no: put the UI back */
    if(on){S.going.delete(u);S.mineAt.delete(u)}else{S.going.add(u);if(was)S.mineAt.set(u,was);S.goOff.delete(u)}
    liveNote('Could not save that — check your connection');openDet(id);render()});
}

  persist('saved',u,on).then(ok=>{if(ok)return;on?S.saved.delete(u):S.saved.add(u);
    liveNote('Could not save that — check your connection');render()});

function opt(el,items,isOn,onPick){
  el.innerHTML='';
  items.forEach(it=>{
    const val=Array.isArray(it)?it[0]:it,label=Array.isArray(it)?it[1]:it;
    const b=document.createElement('button');b.textContent=label;
    b.setAttribute('aria-pressed',isOn(val));
    b.onclick=()=>{onPick(val);buildAll();render()};
    el.appendChild(b);
  });
}

  opt($('#fDoor'),DOORS,v=>S.door.has(v),v=>S.door.has(v)?S.door.delete(v):S.door.add(v));

  opt($('#fPlat'),PLATS,v=>S.plat.has(v),v=>S.plat.has(v)?S.plat.delete(v):S.plat.add(v));

}

});

/* ---------- live data: /api/feed replaces the sample constants above (docs/FRONTEND.md) ---------- */

const nyDate=off=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.now()+off*864e5));

/* ---------- identity: an anonymous Supabase session ----------
   Every visitor gets a durable user_id with no login screen, so "going" and "saved" survive a reload and a
   taste history starts accumulating from day one; the same account is upgraded in place later (linkIdentity /
   updateUser) without losing those rows. The publishable key below is meant to sit in client code — Row Level
   Security is what protects the data: a session may read and write only its own rows (0005), and `going_count`
   is the one public aggregate. Written against the REST endpoints directly so the page keeps its property of
   having no third-party runtime dependency; if any of it fails the app simply falls back to memory-only marks. */
const SB_URL='https://cwjxhddnddvntxpikqbz.supabase.co';
const SB_KEY='sb_publishable_bHn9dc0u9Mfuhuy5INKVUA_U6tTAuMB';
const SB_STORE='noct.session';
let SB=null;
const sbHeaders=t=>Object.assign({apikey:SB_KEY,'content-type':'application/json'},t?{authorization:'Bearer '+t}:{});
function sbRemember(j){
  if(!j||!j.access_token)return null;
  SB={access_token:j.access_token,refresh_token:j.refresh_token,user_id:(j.user||{}).id||'',
      expires_at:Date.now()+((j.expires_in||3600)-60)*1000};
  try{localStorage.setItem(SB_STORE,JSON.stringify(SB))}catch(e){}
  return SB;
}
function sbRestore(){try{const s=JSON.parse(localStorage.getItem(SB_STORE)||'null');if(s&&s.access_token)SB=s}catch(e){}return SB}
async function sbAuth(path,body){
  const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:sbHeaders(),body:JSON.stringify(body)});
  return r.ok?sbRemember(await r.json()):null;
}
/** A live token, refreshing or re-registering as needed. Null when Supabase is unreachable. */
async function sbSession(){
  if(SB&&SB.expires_at>Date.now())return SB;
  try{
    if(SB&&SB.refresh_token){const s=await sbAuth('token?grant_type=refresh_token',{refresh_token:SB.refresh_token});if(s)return s}
    SB=null;try{localStorage.removeItem(SB_STORE)}catch(e){}
    return await sbAuth('signup',{});                      /* anonymous sign-in */
  }catch(e){return null}
}
async function sbRest(method,path,body){
  const s=await sbSession();if(!s)return null;
  const opts={method,headers:Object.assign(sbHeaders(s.access_token),{prefer:'resolution=merge-duplicates'})};
  if(body)opts.body=JSON.stringify(body);
  let r=await fetch(SB_URL+'/rest/v1'+path,opts);
  if(r.status===401){                                      /* token rejected: start a new session once */
    SB=null;const s2=await sbSession();if(!s2)return null;
    opts.headers=Object.assign(sbHeaders(s2.access_token),{prefer:'resolution=merge-duplicates'});
    r=await fetch(SB_URL+'/rest/v1'+path,opts);
  }
  return r;
}
/** A new mark changes the taste profile. Mark it stale rather than blanking it: the rail keeps showing the
    previous answer until a fresh one lands, so marking a night does not make it flicker. */
function invalidateRecs(){S.recs.loaded=false;S.recs.error=false}
/** Mirror one toggle into Postgres. user_id is defaulted to auth.uid() server-side (0014). */
async function persist(table,uuid,on){
  if(!LIVE)return true;                                    /* the sample weekend has no rows to write */
  try{
    const r=on?await sbRest('POST','/'+table,{event_id:uuid}):await sbRest('DELETE','/'+table+'?event_id=eq.'+encodeURIComponent(uuid));
    return !!r&&r.ok;
  }catch(e){return false}
}
/** Load this account's going/saved so a reload (or another device, once the account is upgraded) restores them. */
async function syncMine(){
  if(!LIVE)return;
  try{
    const [g,sv]=await Promise.all([sbRest('GET','/going?select=event_id,created_at'),sbRest('GET','/saved?select=event_id')]);
    if(g&&g.ok){const rows=await g.json();
      S.going=new Set(rows.map(r=>r.event_id));
      S.mineAt=new Map(rows.map(r=>[r.event_id,r.created_at]));}
    if(sv&&sv.ok){const rows=await sv.json();S.saved=new Set(rows.map(r=>r.event_id))}

/* ---------- When: range presets + month calendar ----------
   Plain YYYY-MM-DD strings all the way through (UTC parsing only, so no local-midnight drift). A preset asks
   the API for that window; the calendar asks for counts only (~1 KB a month instead of ~320 KB of records)
   and loads a single night's cards when a date is tapped. */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['S','M','T','W','T','F','S'];
const dAdd=(s,n)=>new Date(Date.parse(s+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const dDow=s=>new Date(Date.parse(s+'T00:00:00Z')).getUTCDay();
const dMonth=s=>s.slice(0,7);
const monthStart=m=>m+'-01';
const monthEnd=m=>{const p=m.split('-').map(Number);return `${m}-${String(new Date(Date.UTC(p[0],p[1],0)).getUTCDate()).padStart(2,'0')}`};
const monthAdd=(m,n)=>{const p=m.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1+n,1)).toISOString().slice(0,7)};

/** [from, to, label] for a preset key, in New York's calendar. */
function rangeOf(key){
  const t=nyDate(0);
  if(key==='tomorrow')return [nyDate(1),nyDate(1),'Tomorrow'];
  if(key==='weekend'){
    const dow=dDow(t);
    if(dow===0)return [t,t,'Tonight'];                        /* Sunday: the weekend ends tonight */
    const start=(dow===5||dow===6)?t:dAdd(t,5-dow);           /* Mon–Thu jump to Friday */
    return [start,dAdd(start,dDow(start)===5?2:1),'This weekend'];
  }
  return [t,t,'Tonight'];
}
function pickRange(key){
  const r=rangeOf(key);
  S.preset=key;S.rangeLabel=r[2];S.picked=r[0]===r[1]?r[0]:'';S.calMonth=dMonth(r[0]);S.dayList='';
  closeAll();loadFeed({from:r[0],to:r[1]});
}
/* A calendar night previews in place: the sheet stays open and the night's cards render under the grid. */
async function pickDate(date){
  S.preset='';S.rangeLabel='';S.picked=date;S.dayList=date;
  renderCal();renderCalList();
  await loadFeed({from:date,to:date});
  renderCalList();
}
/** Tapping one of those cards leaves the sheet and opens that event in the image view. */
function openFromCal(i){closeAll();S.i=i;setView('image')}
function renderCalList(){
  const el=$('#calList');if(!el)return;
  if(!S.dayList){el.innerHTML='';return}
  if(!DAYS.length||DAYS[0][3]!==S.dayList){el.innerHTML=`<div class="grp"><div class="note">Loading…</div></div>`;return}
  const list=results(),d=DAYS[0];
  if(!list.length){el.innerHTML=`<div class="grp"><div class="note">Nothing on ${d[0]} ${d[1]}${nF()?' with your filters':''}.</div></div>`;return}
  el.innerHTML=`<div class="grp"><h3>${d[0]} ${d[1]} · ${list.length} event${list.length===1?'':'s'}</h3>`
    +list.map((e,i)=>`<div class="row" role="button" tabindex="0" onclick="openFromCal(${i})" onkeydown="if(event.key==='Enter'){openFromCal(${i})}">`
      +`<div class="rt">${e.door||'Time on listing'}</div>`
      +`<div class="rn">${e.head}</div>`
      +`<div class="rg">${tagLine(e)}</div>`
      +`<div class="rv">${e.venue}</div>`
      +`<div class="rp ${e.soldout||low(e)===null?'gone':''}">${priceLbl(e)}</div>`
      +`<div class="rs">${platsOf(e)}</div>`
      +`<div class="rgo">${goCount(e.id)} going</div></div>`).join('')
    +`</div>`;
}
function calMove(n){S.calMonth=monthAdd(S.calMonth||dMonth(nyDate(0)),n);renderCal();loadCounts()}
function renderCal(){
  const el=$('#rcal');if(!el)return;
  const m=S.calMonth||dMonth(nyDate(0)),today=nyDate(0);
  const first=monthStart(m),days=Number(monthEnd(m).slice(8)),p=m.split('-').map(Number);
  let cells='';
  for(let i=0;i<dDow(first);i++)cells+='<div class="pad"></div>';
  for(let d=1;d<=days;d++){
    const date=`${m}-${String(d).padStart(2,'0')}`,n=S.counts[date]||0,dis=date<today||!n;
    cells+=`<button ${dis?'disabled':''} aria-pressed="${S.picked===date}"${date===today?' aria-current="date"':''}`
      +` onclick="pickDate('${date}')" aria-label="${d} ${MONTHS[p[1]-1]}, ${n} event${n===1?'':'s'}">`
      +`${d}${n?`<span class="n">${n}</span>`:''}</button>`;
  }
  el.innerHTML=`<div class="calhd">`
    +`<button ${monthAdd(m,-1)>=dMonth(today)?'':'disabled'} onclick="calMove(-1)" aria-label="Previous month">‹</button>`
    +`<div class="m">${MONTHS[p[1]-1]} ${p[0]}</div>`
    +`<button onclick="calMove(1)" aria-label="Next month">›</button></div>`
    +`<div class="calg">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>`
    +`<div class="note">${S.countsNote||FEED_NOTE}</div>`;
}
/** Counts for the visible month, cached per month+city so reopening the sheet is free. */
async function loadCounts(){
  const m=S.calMonth||dMonth(nyDate(0)),city=S.city||'nyc';
  if(S.countsMonth===m&&S.countsCity===city)return;
  if(/[?&]demo=1(&|$)/.test(location.search))return;
  S.countsNote='Loading month…';renderCal();
  try{
    const qs=new URLSearchParams({city,from:monthStart(m),to:monthEnd(m),counts:'1'});
    const r=await fetch(`${API_BASE}/api/feed?${qs}`,{headers:{accept:'application/json'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    (j.days||[]).forEach(d=>{S.counts[d.date]=d.events|0});
    S.countsMonth=m;S.countsCity=city;
    S.countsNote=`${j.total} event${j.total===1?'':'s'} in ${MONTHS[Number(m.slice(5,7))-1]}. Tap a night.`;
  }catch(e){S.countsNote='Month counts unavailable.'}
  renderCal();
}
const ago=iso=>{const m=Math.round((Date.now()-Date.parse(iso))/6e4);return !isFinite(m)?'':m<60?`${m} min ago`:m<2880?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`};
const runLine=s=>{const r=s.last_run;if(!r)return 'Not run yet';if(r.status==='skipped')return 'No key configured';
  if(r.status==='failed')return (r.error||'').indexOf('BLOCKED:')===0?'Blocked by the host':'Last run failed';
  return `${r.seen} listings, ${r.finished_at?ago(r.finished_at):'running'}`};
const liveNote=msg=>{const el=$('#liveNote');el.textContent=msg;el.hidden=!msg};
function applyFeed(f){
  if(!f||!Array.isArray(f.days)||!f.days.length||!Array.isArray(f.events))throw new Error('unexpected feed shape');
  DAYS=f.days.map(d=>[clean(d.label),clean(d.sub),clean(d.hint),d.date]);
  /* id stays the numeric index the onclick handlers expect; the event uuid rides along as uuid */
  EV=f.events.map(e=>({
    id:e.n,uuid:e.id,d:e.d,head:clean(e.head),lineup:(e.lineup||[]).map(clean),venue:clean(e.venue),room:e.room?clean(e.room):'',
    door:clean(e.door),close:clean(e.close),genre:(e.genre||[]).map(clean),gsrc:clean(e.gsrc),primary:e.primary?clean(e.primary):'',
    genre_codes:(e.genre_codes||[]).map(clean),tags:(e.tags||[]).map(t=>({code:clean(t.code),label:clean(t.label)})),
    genre_confidence:typeof e.genre_confidence==='number'?e.genre_confidence:null,
    vibes:(e.vibes||[]).map(v=>({code:clean(v.code),label:clean(v.label),glyph:clean(v.glyph)})),
    scalars:e.scalars||{},sound:clean(e.sound),age:clean(e.age),interested:e.interested||0,
    srcs:(e.srcs||[]).map(s=>[SHORT_PLAT[s[0]]||clean(s[0]),typeof s[1]==='number'?s[1]:null,clean(s[2]),cleanUrl(s[3])]),
    ra:cleanUrl(e.ra),dice:cleanUrl(e.dice),eb:cleanUrl(e.eb),url:cleanUrl(e.url),tex:TEX.indexOf(e.tex)>=0?e.tex:'x1',
    full:!!e.full,soldout:!!e.soldout,note:clean(e.note),status:clean(e.status),image:cleanUrl(e.image),going_count:e.going_count||0
  }));
  const vs={};
  Object.keys(f.venues||{}).forEach(k=>{const v=f.venues[k]||{};vs[clean(k)]={addr:clean(v.addr),hood:clean(v.hood),boro:clean(v.boro),
    ig:clean(v.ig).replace(/[^\w.]/g,''),site:cleanUrl(v.site),ra:cleanUrl(v.ra),dice:cleanUrl(v.dice),verified:!!v.verified,tones:tonesOf(k)}});
  VENUES=vs;
  GENRES=(f.genres||[]).map(clean);
  PLATS=[...new Set(EV.flatMap(e=>e.srcs.map(s=>platformOf(s[0]))))];
  AREAS=['All',...new Set(EV.map(e=>vInfo(e.venue).boro).filter(Boolean))];
  if(Array.isArray(f.cities)&&f.cities.length)CITIES=f.cities.map(c=>[c.key,clean(c.name),!!c.enabled]);
  if(f.city&&f.city.key)S.city=f.city.key;
  SOURCES=(f.sources||[]).map(s=>[clean(s.name),runLine(s),!!(s.last_run&&s.last_run.status!=='failed'&&s.last_run.status!=='skipped')]);
  FEED_NOTE=`Live: ${DAYS.length} night${DAYS.length===1?'':'s'} from ${DAYS[0][2]==='Tonight'?'tonight':DAYS[0][1]}, refreshed every five minutes.`;
  /* the loaded window IS the selection now — the When tab decides what gets loaded */
  S.from=0;S.to=DAYS.length-1;S.i=0;
  if(!S.calMonth)S.calMonth=dMonth(DAYS[0][3]);
  LIVE=true;S.feedAt=f.generated_at||new Date().toISOString();S.goOff.clear();
  if(AREAS.indexOf(S.area)<0)S.area='All';
  buildAll();setView(S.view);
}
/* Where /api lives. Deployed: same origin. Opened from disk or a local static server (UI work): the production
   API, which allows cross-origin reads. Override with ?api=https://host, or ?demo=1 for the sample weekend. */
const LIVE_API='https://noct-navy.vercel.app';
const API_BASE=(()=>{
  const q=new URLSearchParams(location.search).get('api');
  if(q)return q.replace(/\/+$/,'');
  const local=location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  return local?LIVE_API:'';
})();
async function loadFeed(range){
  if(/[?&]demo=1(&|$)/.test(location.search))return;
  const q=new URLSearchParams(location.search);
  if(q.get('city')&&!loadFeed.cityFromUrlUsed){S.city=q.get('city');loadFeed.cityFromUrlUsed=true}
  const city=S.city||'nyc';
  const first=!loadFeed.loadedOnce;loadFeed.loadedOnce=true;
  /* a When-tab pick wins; then ?from/?to on the very first load; otherwise the active preset, so a city
     switch re-asks for the same window in the new city's own calendar */
  let from=null,to=null;
  if(range){from=range.from;to=range.to}
  else if(first&&(q.get('from')||q.get('to'))){from=q.get('from');to=q.get('to');S.preset='';S.rangeLabel=''}
  else{const r=rangeOf(S.preset||'tonight');from=r[0];to=r[1];S.rangeLabel=r[2];S.picked=r[0]===r[1]?r[0]:''}
  const qs=new URLSearchParams({city});if(from)qs.set('from',from);if(to)qs.set('to',to);
  liveNote('Loading '+(CITIES.find(c=>c[0]===city)||[,city])[1]+'…');
  try{
    const r=await fetch(`${API_BASE}/api/feed?${qs}`,{headers:{accept:'application/json'}});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    applyFeed(await r.json());
    liveNote('');
    syncMine();                      /* restore this account's going/saved; renders again when it lands */
    loadRecs();                      /* the rail is pinned to every view, so recommendations load with the feed */
  }catch(err){
    liveNote('Live data unavailable — showing sample weekend');
  }
}
sbRestore();buildAll();setView('image');loadFeed();
